name: Live data – collection & GitHub Pages deploy
run-name: ${{ inputs.trigger == 'schedule' && format('Thu thập theo lịch {0} – {1} → {2} [{3}]', inputs.slot, inputs.from, inputs.to, inputs.profile) || inputs.from && format('Thu thập theo yêu cầu {0} → {1} ({2}) [{3}]', inputs.from, inputs.to, inputs.requested_by, inputs.profile) || inputs.trigger == 'auto' && 'Thu thập tự động hằng giờ' || 'Live data – collection & GitHub Pages deploy' }}

# Automatic runs are NOT a GitHub `schedule:` (often late or skipped). The Cloudflare review worker's cron (every 5 min)
# dispatches this workflow with trigger=schedule + the window of a fixed time ticked on the web for a profile
# (08:00: 17:00 yesterday → 08:01, i.e. 08:00 included; 16:30: 08:01 → 16:30 – src/domain/schedule.ts), once per profile and day.
on:
  push:
    branches: [main]
  workflow_dispatch:
    # on-demand window from the web "Thu thập" button, or trigger=auto from the worker cron
    inputs:
      trigger:
        description: 'schedule = lượt theo lịch cố định (do worker gửi)'
        required: false
        default: ''
      slot:
        description: 'Giờ của lịch (08:00 / 16:30)'
        required: false
        default: ''
      from:
        description: 'Từ (ISO +07:00), ví dụ 2026-11-14T17:00+07:00'
        required: false
        default: ''
      to:
        description: 'Đến (ISO +07:00, không gồm)'
        required: false
        default: ''
      requested_by:
        description: 'Người yêu cầu'
        required: false
        default: ''
      profile:
        description: 'Mã cấu hình (profile) cho lượt theo yêu cầu, ví dụ hcm'
        required: false
        default: ''

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false # never cut a running collection; runs queue instead

jobs:
  collect-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 55 # the hourly run collects every profile switched on
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Real collection from the configured publishers, one dataset per profile (live/<profile>/).
      # If this step fails, the job stops and the previously deployed site stays online unchanged.
      - name: Collect live data
        env: # inputs passed through env (never interpolated into the shell command)
          REQ_FROM: ${{ inputs.from }}
          REQ_TO: ${{ inputs.to }}
          REQ_BY: ${{ inputs.requested_by }}
          REQ_PROFILE: ${{ inputs.profile }}
          REQ_SLOT: ${{ inputs.slot }}
          REVIEW_API_URL: ${{ vars.REVIEW_API_URL }} # shared configuration edited on the web (Cài đặt)
        run: |
          if [ -n "$REQ_FROM" ]; then
            npx tsx scripts/cloud-collect.ts --site "https://tinbaochi.github.io/" --out web/public/live --from "$REQ_FROM" --to "$REQ_TO" --requested-by "$REQ_BY" --scheduled "$REQ_SLOT" --profile "${REQ_PROFILE:-hcm}"
          else
            npx tsx scripts/cloud-collect.ts --site "https://tinbaochi.github.io/" --out web/public/live
          fi
      - run: npm run build:pages
        env:
          REVIEW_API_URL: ${{ vars.REVIEW_API_URL }}
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist/pages

  deploy:
    needs: collect-and-build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
