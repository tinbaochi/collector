name = "hcm-news-review"
main = "src/index.ts"
compatibility_date = "2024-11-01"

# hourly automatic collection (UTC; minute 7). Switched on/off from the web ("Tự động thu thập mỗi giờ", KV cfg:auto).
# Cloudflare cron triggers fire on time, unlike GitHub's `schedule:` which can be late or skipped.
[triggers]
crons = ["2-59/5 * * * *"] # :02, :07 … – the fixed times 08:00 / 16:30 run at 08:02 / 16:32 (feeds catch up 2 min)

[vars]
ALLOWED_ORIGINS = "https://tinbaochi.github.io,https://bccuong.github.io" # old address kept while the redirect page lives there
GITHUB_REPO = "tinbaochi/tinbaochi.github.io"
COLLECT_WORKFLOW = "pages.yml"

# KV namespace id is filled in by `npx wrangler kv namespace create REVIEWS` (see cloud/README.md)
# the team's review of each period (one Durable Object per profile + period; SQLite storage, Workers Free plan)
[[durable_objects.bindings]]
name = "REVIEW_DO"
class_name = "ReviewPeriod"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["ReviewPeriod"]

[[kv_namespaces]]
binding = "REVIEWS"
id = "229cb5fc8b7a4474a199d2b025c71c35"

# Secrets (never committed): npx wrangler secret put EXPORT_TOKEN / GITHUB_TOKEN
# GITHUB_TOKEN = fine-grained PAT, repository tinbaochi/tinbaochi.github.io only, permission "Actions: Read and write"
